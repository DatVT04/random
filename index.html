<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dani De Beauté | Vòng quay yêu thương</title>
<style>
  :root{
    --wine:#8d1748;
    --berry:#b51d5b;
    --pink:#d99ab9;
    --rose:#c77a9e;
    --pale:#f5e9ef;
    --blue:#dceff3;
    --ink:#54283c;
    --paper:#fffdfd;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--ink);
    font-family:Georgia,"Times New Roman",serif;
    background:linear-gradient(135deg,#f8edf2 0%,#fffdfd 48%,#f4e6ed 100%);
    display:flex; justify-content:center; align-items:center; padding:22px;
  }
  .page{
    width:min(100%,780px); text-align:center; padding:clamp(20px,5vw,48px) clamp(16px,5vw,44px) 32px;
    background:rgba(255,255,255,.76); border:1px solid #f0dce5;
    border-radius:4px; box-shadow:0 16px 50px rgba(110,38,70,.08);
  }
  .brand{font:600 12px/1.5 Arial,sans-serif; letter-spacing:.19em; color:var(--wine); text-transform:uppercase}
  .eyebrow{font:500 11px/1.5 Arial,sans-serif; letter-spacing:.22em; margin-top:38px; color:#75515f}
  h1{font-size:clamp(34px,6.4vw,54px); line-height:1.06; font-weight:500; margin:18px 0 14px; color:#59263d}
  h1 em{color:var(--berry); font-weight:500}
  .intro{font:15px/1.7 Arial,sans-serif; margin:0 auto; max-width:440px}
  .hint{font:12px/1.5 Arial,sans-serif; margin:12px 0 25px; color:#8b6978}
  .wheel-wrap{width:min(78vw,390px); margin:0 auto 22px; position:relative; aspect-ratio:1}
  canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 5px 7px rgba(96,35,61,.08))}
  .pointer{
    position:absolute; top:-3px; left:50%; transform:translateX(-50%);
    width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;
    border-top:32px solid var(--wine);border-bottom:0; z-index:2;
    filter:drop-shadow(0 2px 1px rgba(60,20,36,.12));
  }
  .spin{
    border:0; border-radius:40px; background:var(--berry); color:white; cursor:pointer;
    padding:17px 42px; min-width:220px; font:600 13px Arial,sans-serif; letter-spacing:.08em;
    box-shadow:0 6px 16px rgba(181,29,91,.16); transition:transform .2s,background .2s;
  }
  .spin:hover{background:var(--wine);transform:translateY(-1px)}
  .spin:disabled{opacity:.65;cursor:wait;transform:none}
  .result{min-height:30px;margin:17px 0 0;font:14px/1.6 Arial,sans-serif;color:var(--wine)}
  .stock{display:none}
  .edit-note{font:10px/1.6 Arial,sans-serif;color:#b6a0aa;margin-top:24px}
  .edit-toggle{margin-top:10px;border:0;background:transparent;color:#b6a0aa;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:11px Arial,sans-serif}
  .fireworks{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
  .spark{position:absolute;width:7px;height:7px;border-radius:50%;animation:burst 1.25s ease-out forwards;box-shadow:0 0 10px currentColor}
  @keyframes burst{0%{transform:translate(0,0) scale(.3);opacity:1}75%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.05);opacity:0}}
  .edit-panel{position:relative;z-index:11}
  .edit-panel{display:none;text-align:left;margin:26px auto 0;max-width:510px;border-top:1px solid #efdce5;padding-top:18px;font-family:Arial,sans-serif}
  .edit-panel.show{display:block}
  .edit-panel h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--wine)}
  .edit-panel label{display:block;font-size:12px;margin:10px 0 5px}
  .edit-panel input,.edit-panel textarea{width:100%;padding:10px;border:1px solid #e7ced9;background:#fffafa;border-radius:4px;font:13px Arial,sans-serif;color:var(--ink)}
  .edit-panel textarea{min-height:92px;resize:vertical}
  .edit-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .small-btn{padding:10px 14px;border:1px solid #d9a8bd;background:#fff;color:var(--wine);border-radius:24px;cursor:pointer;font:12px Arial,sans-serif}
  .small-btn.primary{background:var(--wine);color:#fff}
  @media(max-width:480px){
    body{padding:0;background:#fff8fb}
    .page{min-height:100vh;border:0;padding:30px 18px 25px;box-shadow:none}
    .eyebrow{margin-top:31px}
    .wheel-wrap{width:min(86vw,350px);margin-bottom:19px}
    .spin{width:min(100%,300px)}
  }
</style>
</head>
<body>
<main class="page">
  <div class="brand" id="brand">DANI DE BEAUTÉ</div>
  <div class="eyebrow" id="eyebrow">Happy Vietnamese Women's Day</div>
  <h1 id="headline">Tháng của nàng<br> Tặng ngàn <em>yêu thương.</em></h1>
  <p class="intro" id="intro">Dani chúc nàng luôn xinh đẹp, rạng rỡ theo cách của riêng mình</p>
  <p class="hint" id="hint">Chạm để quay và nhận món quà của bạn.</p>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="900" height="900" aria-label="Vòng quay may mắn"></canvas>
  </div>
  <button class="spin" id="spin">QUAY NHẬN QUÀ</button>
  <div class="result" id="result" aria-live="polite"></div>
  <div class="stock" id="stock"></div>
  <div class="edit-note">DANI DE BEAUTÉ</div>
  <button class="edit-toggle" id="editToggle" type="button">Chỉnh sửa nội dung</button>
  <div class="fireworks" id="fireworks" aria-hidden="true"></div>

  <section class="edit-panel" id="editPanel">
    <h2>Chỉnh sửa nội dung</h2>
    <label for="brandInput">Tên thương hiệu</label>
    <input id="brandInput" value="DANI DE BEAUTÉ">
    <label for="eyebrowInput">Dòng chữ nhỏ phía trên</label>
    <input id="eyebrowInput" value="Happy Vietnamese Women's Day">
    <label for="headlineInput">Tiêu đề (dùng | để xuống dòng, *...* để in nghiêng màu hồng)</label>
    <input id="headlineInput" value="Tháng của nàng| Tặng ngàn *yêu thương.*">
    <label for="introInput">Mô tả</label>
    <textarea id="introInput">Dani chúc nàng luôn xinh đẹp, rạng rỡ theo cách của riêng mình</textarea>
    <label for="hintInput">Hướng dẫn</label>
    <input id="hintInput" value="Chạm để quay và nhận món quà của bạn.">
    <label for="prizesInput">Danh sách quà — mỗi dòng một món, định dạng Tên quà: Số lượng</label>
    <textarea id="prizesInput">Nến thơm: 10
Voucher 200K: 10
Ly/cốc: 10
Lược gỡ rối tóc: 10
Voucher 200K: 10
1 buổi làm sạch trị giá 800k: 10</textarea>
    <div class="edit-actions">
      <button class="small-btn primary" id="applyEdit">Áp dụng thay đổi</button>
      <button class="small-btn" id="resetStock">Đặt lại số lượng</button>
      <button class="small-btn" id="exportHtml">Tải bản HTML đã chỉnh sửa</button>
    </div>
  </section>
</main>
<script>
/*
  BẢN CÓ THỂ SỬA:
  - Nhấn Ctrl + Shift + E (Mac: Control + Shift + E) để mở/đóng bảng chỉnh sửa.
  - Hoặc sửa trực tiếp các giá trị mặc định trong phần HTML bên dưới.
  - Muốn công khai website: tải file HTML lên dịch vụ hosting tĩnh.
*/
const DEFAULT_PRIZES = [
  { name: "Nến thơm", qty: 10 },
  { name: "Voucher 200K", qty: 10 },
  { name: "Ly/cốc", qty: 10 },
  { name: "Lược gỡ rối tóc", qty: 10 },
  { name: "Voucher 200K", qty: 10 },
  { name: "1 buổi làm sạch trị giá 800k", qty: 10 }
];
const COLORS = ["#d99ab9", "#b51d5b", "#e8d9e9", "#c77a9e", "#dceff3", "#f0d8e4"];
let prizes = DEFAULT_PRIZES.map(p => ({...p, remaining:p.qty}));
let angle = 0, spinning = false;
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const $ = id => document.getElementById(id);

function drawWheel(){
  const size = canvas.width, c = size/2, r = size/2-24, n = prizes.length;
  ctx.clearRect(0,0,size,size);
  ctx.beginPath(); ctx.arc(c,c,r+10,0,Math.PI*2); ctx.fillStyle="#dceff3"; ctx.fill();
  ctx.beginPath(); ctx.arc(c,c,r,0,Math.PI*2); ctx.fillStyle="#fff"; ctx.fill();
  const step = Math.PI*2/n;
  prizes.forEach((p,i)=>{
    const start = angle + i*step - Math.PI/2;
    const end = start + step;
    ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,start,end);ctx.closePath();
    ctx.fillStyle=COLORS[i%COLORS.length];ctx.fill();
    ctx.strokeStyle="#f7edf2";ctx.lineWidth=7;ctx.stroke();
    ctx.save();ctx.translate(c,c);ctx.rotate(start+step/2);
    ctx.textAlign="center";ctx.textBaseline="middle";
    const label=p.name; const maxChars=17;
    const lines=[];
    if(label.length>maxChars && label.includes(" ")) {
      let line="";
      label.split(" ").forEach(word=>{if((line+" "+word).trim().length>maxChars){lines.push(line);line=word}else line=(line+" "+word).trim()});
      if(line)lines.push(line);
    } else lines.push(label);
    ctx.fillStyle="#55283e";ctx.font="600 27px Arial, sans-serif";
    const x=r*.61, lineHeight=34, startY=-(lines.length-1)*lineHeight/2;
    lines.slice(0,3).forEach((line,j)=>ctx.fillText(line,x,startY+j*lineHeight,220));
    if(p.remaining<=0){ctx.fillStyle="rgba(255,255,255,.58)";ctx.fillRect(x-100,-25,200,50)}
    ctx.restore();
  });
  ctx.beginPath();ctx.arc(c,c,62,0,Math.PI*2);ctx.fillStyle="#dceff3";ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=8;ctx.stroke();
  ctx.fillStyle="#8d1748";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="italic 30px Georgia";ctx.fillText("D",c,c-3);
}
function updateStock(){
  // Số lượng quà chỉ dùng nội bộ để giới hạn lượt trúng, không hiển thị cho người chơi.
  $("stock").textContent = "";
}
function available(){return prizes.map((p,i)=>({...p,index:i})).filter(p=>p.remaining>0)}
function launchFireworks(){
  const layer = $("fireworks");
  const colors = ["#b51d5b","#d99ab9","#f3c969","#dceff3","#ffffff","#c77a9e"];
  const bursts = 5;
  for(let b=0;b<bursts;b++){
    const cx = 12 + Math.random()*76, cy = 14 + Math.random()*58;
    const count = 24;
    for(let i=0;i<count;i++){
      const s=document.createElement("span");
      s.className="spark";
      s.style.left=cx+"%"; s.style.top=cy+"%";
      s.style.color=colors[Math.floor(Math.random()*colors.length)];
      s.style.background=s.style.color;
      const a=(Math.PI*2*i/count)+(Math.random()-.5)*.22;
      const d=45+Math.random()*115;
      s.style.setProperty("--dx",Math.cos(a)*d+"px");
      s.style.setProperty("--dy",Math.sin(a)*d+"px");
      s.style.animationDelay=(Math.random()*.22)+"s";
      layer.appendChild(s);
      setTimeout(()=>s.remove(),1700);
    }
  }
}
function playFireworksSound(){
  // Âm thanh pháo hoa tổng hợp bằng Web Audio, không cần tải file âm thanh ngoài.
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx)return;
    const ac=new AudioCtx();
    [0,180,390].forEach((delay,index)=>{
      setTimeout(()=>{
        const duration=.18+Math.random()*.16;
        const buffer=ac.createBuffer(1,Math.floor(ac.sampleRate*duration),ac.sampleRate);
        const data=buffer.getChannelData(0);
        for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);
        const source=ac.createBufferSource();source.buffer=buffer;
        const filter=ac.createBiquadFilter();filter.type="highpass";filter.frequency.value=500+index*300;
        const gain=ac.createGain();gain.gain.setValueAtTime(.0001,ac.currentTime);gain.gain.exponentialRampToValueAtTime(.20,ac.currentTime+.015);gain.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+duration);
        source.connect(filter);filter.connect(gain);gain.connect(ac.destination);source.start();
      },delay);
    });
    setTimeout(()=>ac.close(),1300);
  }catch(e){}
}
function spin(){
  if(spinning)return;
  const choices=available();
  if(!choices.length){$("result").textContent="Các phần quà đã được nhận hết.";return}
  spinning=true;$("spin").disabled=true;$("result").textContent="";
  // Randomly choose among prize types that still have stock.
  const picked=choices[Math.floor(Math.random()*choices.length)];
  const n=prizes.length, step=2*Math.PI/n;
  const desired = (Math.PI*2 - ((picked.index+0.5)*step))%(Math.PI*2);
  const current = ((angle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  const delta = (desired-current+Math.PI*2)%(Math.PI*2);
  const start=angle, target=angle + Math.PI*2*(5+Math.floor(Math.random()*3)) + delta;
  const duration=4300, startTime=performance.now();
  function frame(now){
    const t=Math.min(1,(now-startTime)/duration), eased=1-Math.pow(1-t,4);
    angle=start+(target-start)*eased;drawWheel();
    if(t<1){requestAnimationFrame(frame)}else{
      angle=target;prizes[picked.index].remaining--;
      drawWheel();updateStock();
      $("result").textContent=`Chúc mừng bạn nhận được: ${prizes[picked.index].name}!`;
      launchFireworks();playFireworksSound();
      spinning=false;$("spin").disabled=false;
    }
  }
  requestAnimationFrame(frame);
}
function applyEdits(){
  $("brand").textContent=$("brandInput").value.trim()||"DANI DE BEAUTÉ";
  $("eyebrow").textContent=$("eyebrowInput").value;
  const headline=$("headlineInput").value.split("|");
  $("headline").innerHTML=headline.map(line=>line.replace(/\*(.*?)\*/g,"<em>$1</em>")).join("<br>");
  $("intro").innerHTML=$("introInput").value.split("\n").map(s=>escapeHTML(s)).join("<br>");
  $("hint").textContent=$("hintInput").value;
  const parsed=$("prizesInput").value.split("\n").map(line=>{
    const match=line.match(/^(.*?):\s*(\d+)\s*$/);
    return match?{name:match[1].trim(),qty:Math.max(0,parseInt(match[2],10))}:null;
  }).filter(p=>p&&p.name);
  if(parsed.length<2){alert("Vui lòng nhập ít nhất 2 phần quà, mỗi dòng theo dạng Tên quà: Số lượng.");return}
  prizes=parsed.map(p=>({...p,remaining:p.qty}));angle=0;drawWheel();updateStock();
  $("result").textContent="";
  saveEdits();
}
const EDIT_IDS=["brandInput","eyebrowInput","headlineInput","introInput","hintInput","prizesInput"];
const EDIT_KEY="dani-wheel-edits-v2";
function saveEdits(){
  try{localStorage.setItem(EDIT_KEY,JSON.stringify(Object.fromEntries(EDIT_IDS.map(id=>[id,$(id).value]))))}catch(e){}
}
function loadEdits(){
  try{
    const saved=JSON.parse(localStorage.getItem(EDIT_KEY)||"null");
    if(!saved)return;
    EDIT_IDS.forEach(id=>{if(typeof saved[id]==="string")$(id).value=saved[id]});
    applyEdits();
  }catch(e){}
}
function escapeHTML(s){return s.replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
$("spin").addEventListener("click",spin);
$("applyEdit").addEventListener("click",applyEdits);
$("resetStock").addEventListener("click",()=>{prizes.forEach(p=>p.remaining=p.qty);updateStock();$("result").textContent="Số lượng quà đã được đặt lại.";drawWheel()});
function toggleEditor(){$("editPanel").classList.toggle("show");if($("editPanel").classList.contains("show"))$("editPanel").scrollIntoView({behavior:"smooth",block:"nearest"});}
$("editToggle").addEventListener("click",toggleEditor);
document.addEventListener("keydown",e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==="e")toggleEditor();});
$("exportHtml").addEventListener("click",()=>{
  const clone=document.documentElement.cloneNode(true);
  clone.querySelector("#editPanel")?.classList.remove("show");
  clone.querySelector("#editToggle")?.setAttribute("style","display:none");
  const text="<!DOCTYPE html>\n"+clone.outerHTML;
  const blob=new Blob([text],{type:"text/html;charset=utf-8"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download="dani-de-beaute-vong-quay.html";a.click();URL.revokeObjectURL(url);
});
drawWheel();updateStock();loadEdits();
</script>
</body>
</html>
